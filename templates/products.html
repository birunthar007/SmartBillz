{% extends "base.html" %}{% block content %}<section class="page"><div class="title"><div><h1>Add Item</h1><p>Starter {{shop.type}} items are already loaded. Edit or delete them.</p></div></div><div class="panel"><form method="post" class="formgrid"><input name="name" placeholder="Product name" required><input name="stock" type="number" min="0" placeholder="Stock" required><input name="price" type="number" min="0" step=".01" placeholder="Price" required><input name="low_stock" type="number" min="0" value="5" placeholder="Low stock limit"><input name="category" placeholder="Category"><button>Add New Item</button></form></div><div class="panel tablewrap"><table><tr><th>Name</th><th>Stock</th><th>Price</th><th>Low limit</th><th>Actions</th></tr>{% for p in products %}<tr><form method="post"><input type="hidden" name="id" value="{{p.id}}"><td><input name="name" value="{{p.name}}"></td><td><input name="stock" type="number" value="{{p.stock}}"></td><td><input name="price" step=".01" value="{{p.price}}"></td><td><input name="low_stock" value="{{p.low_stock}}"></td><td><button>Save</button> <a class="danger" href="/products/delete/{{p.id}}">Delete</a></td></form></tr>{% endfor %}</table></div></section>{% endblock %}
